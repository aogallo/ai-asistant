[project]
name = "ai_assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.79.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.128.6",
    "httpx>=0.28.1",
    "instructor>=1.14.5",
    "pandas>=3.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-multipart>=0.0.9",
    "pypdf>=6.7.0",
    "python-dotenv>=1.2.1",
    "sqlalchemy[asyncio]>=2.0.0",
    "sqlmodel>=0.0.22",
    "structlog>=25.5.0",
    "tesseract>=0.1.3",
    "unstructured>=0.18.32",
    "uvicorn>=0.40.0",
    "psycopg[binary]>=3.2.0",
    "xlrd>=2.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "openpyxl>=3.1.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.0.0",
]



